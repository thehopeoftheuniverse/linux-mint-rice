; ============================================================================
;  polybar · @THEME_NAME@ · unified floating rounded pill bar
; ============================================================================

[global/wm]
margin-top = 0
margin-bottom = 0

[bar/top]
monitor = ${env:MONITOR:}
width = 100%:-40
height = 36
offset-x = 20
offset-y = 10
background = @BG_DARK@
foreground = @FG@
border-size = 1
border-color = @BG_HL@
line-size = 2
line-color = @ACCENT@
radius = 10
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=10.5;3"
font-1 = "JetBrainsMono Nerd Font:size=12;3"
font-2 = "JetBrainsMono Nerd Font:weight=bold:size=10.5;3"
modules-left = launcher i3
modules-center = media
modules-right = updates network cpu memory pulseaudio date tray powermenu
enable-ipc = true
wm-restack = i3
override-redirect = true
dpi = 96
separator = ""

[module/launcher]
type = custom/script
exec = echo "%{T2}@GLYPH_LINUX@%{T-}"
interval = 3600
format-foreground = @ACCENT@
format-padding = 1
click-left = rofi -show drun
click-right = ~/.config/i3/scripts/cheatsheet.sh

[module/i3]
type = internal/i3
format = <label-state><label-mode>
pin-workspaces = false
show-urgent = true
strip-workspace-numbers = false

label-focused = "%{T3}%name%%{T-}"
label-focused-foreground = @ACCENT@
label-focused-underline = @ACCENT@
label-focused-padding = 2

label-unfocused = "%name%"
label-unfocused-foreground = @FG_DIM@
label-unfocused-padding = 2

label-visible = "%name%"
label-visible-foreground = @FG@
label-visible-underline = @BG_HL@
label-visible-padding = 2

label-urgent = "%{T3}%name%%{T-}"
label-urgent-foreground = @RED@
label-urgent-underline = @RED@
label-urgent-padding = 2

label-mode = " %{T3}%mode%%{T-}"
label-mode-foreground = @ORANGE@
label-mode-underline = @ORANGE@
label-mode-padding = 2

label-separator = ""

[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/media.sh
interval = 2
format = <label>
format-padding = 1
label = %output%
label-maxlen = 32
click-left = playerctl play-pause
click-right = playerctl next

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
format = <label>
label = %output%
label-foreground = @FG@
label-padding = 1
click-left = ~/.config/i3/scripts/network-menu.sh

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "%{T2}@GLYPH_CPU@%{T-} "
format-prefix-foreground = @CYAN@
format = %{A1:alacritty -e btop:}<label>%{A}
label = %percentage:2%%
label-foreground = @FG@
format-padding = 1

[module/memory]
type = custom/script
interval = 3
exec = free -m | awk '/^Mem:/ {printf "%.1f/%.1fG", $3/1024, $2/1024}'
format-prefix = "%{T2}@GLYPH_MEM@%{T-} "
format-prefix-foreground = @PURPLE@
format = <label>
label = %output%
label-foreground = @FG@
format-padding = 1
click-left = alacritty -e btop

[module/pulseaudio]
type = internal/pulseaudio
interval = 5
format-volume = <ramp-volume> <label-volume>
format-volume-padding = 1
format-muted = <label-muted>
format-muted-padding = 1
label-volume = %percentage%%
label-volume-foreground = @FG@
label-muted = "%{T2}@GLYPH_VOL_MUTE@%{T-} muted"
label-muted-foreground = @RED@
ramp-volume-0 = %{T2}@GLYPH_VOL_MUTE@%{T-}
ramp-volume-1 = %{T2}@GLYPH_VOL_DOWN@%{T-}
ramp-volume-2 = %{T2}@GLYPH_VOL_UP@%{T-}
ramp-volume-foreground = @YELLOW@
click-right = pavucontrol

[module/date]
type = internal/date
interval = 1
date = "%a %d %b"
time = "%H:%M"
format-prefix = "%{T2}@GLYPH_CLOCK@%{T-} "
format-prefix-foreground = @ACCENT@
label = %date% · %time%
label-foreground = @FG@
format-padding = 1

[module/powermenu]
type = custom/script
exec = echo "%{T2}@GLYPH_POWER@%{T-}"
interval = 3600
format-foreground = @RED@
format-padding = 1
click-left = ~/.config/i3/scripts/powermenu.sh

[module/tray]
type = internal/tray
format-margin = 4px
tray-size = 16px
tray-spacing = 8px
tray-background = @BG_DARK@

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 600
format = <label>
format-padding = 1
label = %output%
click-left = alacritty -e ~/.config/i3/scripts/upgrade.sh
