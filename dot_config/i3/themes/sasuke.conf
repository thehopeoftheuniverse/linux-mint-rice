# Naruto: Sasuke (Midnight Void + Purple Susanoo & Rinnegan Violet)
set $void      #06040c
set $base      #0a0714
set $surface   #130e24
set $inactive  #2d2152
set $text      #f5f3ff
set $muted     #a78bfa
set $susanoo   #a855f7
set $rinnegan  #c084fc
set $lavender  #d8b4fe
set $urgent    #f43f5e

# target                 title     bg     text   indicator  border
client.focused           $susanoo  $base  $text  $rinnegan  $susanoo
client.focused_inactive  $inactive $void  $muted $inactive  $inactive
client.unfocused         $inactive $void  $muted $inactive  $inactive
client.urgent            $urgent   $base  $urgent $lavender $urgent
