;; Polybar User Modules (Nerd Font icons + Theme Switcher)

[module/updates]
type = custom/script
exec = ~/.config/polybar/forest/scripts/updates.sh
tail = true
interval = 0

format = <label>
format-prefix = "󰏗 "
format-prefix-foreground = ${color.yellow}
label = "%output%"

click-left = bash -c 'command -v mintupdate >/dev/null && exec mintupdate || exec kitty -e bash -c "sudo apt update && sudo apt upgrade; read -p \"Done. Press Enter...\""'
click-right = bash -c 'if [ -x "$HOME/.local/bin/run-topgrade" ]; then env FROM_ROFI=1 kitty --hold -- "$HOME/.local/bin/run-topgrade"; else exec kitty -e bash -c "sudo apt update && sudo apt upgrade; read -p \"Done. Press Enter...\""; fi'

[module/launcher]
type = custom/text
content = "󰀻"
content-foreground = ${color.accent}
click-left = ~/.config/rofi/scripts/launcher_t1 &
click-right = ~/.config/scripts/ui/ui-menu.sh &

[module/theme-switch]
type = custom/text
content = "󰏘"
content-foreground = ${color.accent-alt}
click-left = ~/.config/scripts/ui/ui-menu.sh &
click-right = ~/.config/scripts/ui/theme-switch.sh --cycle &

[module/color-switch]
inherit = module/theme-switch

[module/sysmenu]
type = custom/text
content = "⏻"
content-foreground = ${color.cyan}
click-left = ~/.config/rofi/scripts/powermenu_t1 &

[module/sep]
type = custom/text
content = "│"
content-foreground = ${color.sep}

[module/powermenu]
type = custom/text
content = "⏻"
content-foreground = ${color.red}
click-left = ~/.config/rofi/scripts/powermenu_t1 &
click-right = ~/.config/polybar/forest/scripts/powermenu.sh &
