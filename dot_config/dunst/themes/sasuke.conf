# Sasuke (Midnight Void + Purple Susanoo & Rinnegan Violet)
[global]
    frame_color = "#a855f7"
    separator_color = "#2d2152"
    highlight = "#c084fc"

[urgency_low]
    background = "#0a0714"
    foreground = "#ddd6fe"
    frame_color = "#2d2152"
    timeout = 6

[urgency_normal]
    background = "#0a0714"
    foreground = "#f5f3ff"
    frame_color = "#a855f7"
    timeout = 8

[urgency_critical]
    background = "#06040c"
    foreground = "#f5f3ff"
    frame_color = "#f43f5e"
    timeout = 0
