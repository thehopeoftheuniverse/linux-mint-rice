# Minimal low-overhead picom profile (xrender fallback with translucent windows)
backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.25;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Rofi'",
  "class_g = 'slop'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

active-opacity = 1.0;
inactive-opacity = 0.94;
frame-opacity = 0.92;
opacity-rule = [
  "100:fullscreen",
  "100:class_g = 'kitty' && focused",
  "96:class_g = 'kitty' && !focused",
  "100:class_g = 'Rofi'",
  "100:class_g = 'Dunst'",
  "100:class_g = 'Polybar'"
];

corner-radius = 0;
blur-background = false;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;

wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; fade = false; };
  menu = { shadow = false; opacity = 1.0; };
  popup_menu = { shadow = false; opacity = 1.0; };
  dropdown_menu = { shadow = false; opacity = 1.0; };
};
