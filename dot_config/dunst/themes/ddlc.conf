# DDLC (Dark Clubroom - Sakura Pink & Monika Emerald)
[global]
    frame_color = "#ff6b9d"
    separator_color = "#2a1b30"
    highlight = "#34d399"

[urgency_low]
    background = "#130c16"
    foreground = "#f5d0e2"
    frame_color = "#3a2642"
    timeout = 6

[urgency_normal]
    background = "#130c16"
    foreground = "#fff0f6"
    frame_color = "#ff6b9d"
    timeout = 8

[urgency_critical]
    background = "#0e0910"
    foreground = "#fff0f6"
    frame_color = "#f43f5e"
    timeout = 0
