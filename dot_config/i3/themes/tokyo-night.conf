# Tokyo Night
set $bg       #1a1b26
set $bg_dark  #16161e
set $inactive #292e42
set $fg       #c0caf5
set $blue     #7aa2f7
set $purple   #bb9af7
set $red      #f7768e

# target                 title     bg       text  indicator border
client.focused           $blue     $bg      $fg   $purple   $blue
client.focused_inactive  $inactive $bg_dark $fg   $inactive $inactive
client.unfocused         $inactive $bg_dark $fg   $inactive $inactive
client.urgent            $red      $bg      $red  $red      $red
client.placeholder       $inactive $bg_dark $fg   $inactive $inactive
client.background        $bg_dark
