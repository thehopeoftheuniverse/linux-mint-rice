; ============================================================================
;  polybar · @THEME_NAME@
; ============================================================================

[global/wm]
margin-top = 0
margin-bottom = 0

[bar/top]
monitor = ${env:MONITOR:}
width = 100%
height = 36
offset-x = 0
offset-y = 0
background = @BG_DARK@
foreground = @FG@
border-size = 0
border-bottom-size = 1
border-bottom-color = @BG_HL@
radius = 0
padding-left = 2
padding-right = 1
module-margin-left = 2
module-margin-right = 2
font-0 = "JetBrainsMono Nerd Font:size=11;3"
font-1 = "JetBrainsMono Nerd Font:size=12;4"
font-2 = "JetBrainsMono Nerd Font:weight=bold:size=10.5;3"
modules-left = i3
modules-center = title
modules-right = updates cpu memory pulseaudio media date tray powermenu
enable-ipc = true
wm-restack = i3
override-redirect = false
dpi = 96
separator = ""

[module/i3]
type = internal/i3
format = <label-state>
label-focused = " %name% "
label-focused-foreground = @BG_DARK@
label-focused-background = @BLUE@
label-focused-padding = 1
label-unfocused = " %name% "
label-unfocused-foreground = @MUTED@
label-unfocused-padding = 1
label-visible = " %name% "
label-visible-foreground = @FG_DIM@
label-visible-padding = 1
label-urgent = " %name% "
label-urgent-foreground = @BG_DARK@
label-urgent-background = @RED@
label-urgent-padding = 2
label-separator = " "
label-separator-foreground = @BG_HL@
label-separator-padding = 0
strip-workspace-numbers = false

[module/title]
type = internal/xwindow
format = <label>
label = "  %title:0:64:…%"
label-foreground = @FG@
label-padding = 3
label-empty = ""

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = " @GLYPH_CPU@ "
format-prefix-foreground = @MUTED@
format = <label>
label = %percentage:2%%
label-foreground = @FG@
label-padding = 2

[module/memory]
type = custom/script
interval = 5
exec = free -b | awk '/^Mem:/ {printf "%.0f%%", $3/$2*100}'
format-prefix = " @GLYPH_MEM@ "
format-prefix-foreground = @MUTED@
format = <label>
label = %output%
label-foreground = @FG@
label-padding = 2

[module/disk]
type = internal/fs
interval = 30
mount-0 = /
format-prefix = " @GLYPH_DISK@ "
format-prefix-foreground = @MUTED@
format = <label>
label = %percentage_used%%
label-foreground = @FG@
label-padding = 2

[module/pulseaudio]
type = internal/pulseaudio
interval = 0.5
format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>
label-volume = %percentage%%
label-volume-foreground = @FG@
label-muted = muted
label-muted-foreground = @RED@
ramp-volume-0 = @GLYPH_VOL_MUTE@
ramp-volume-1 = @GLYPH_VOL_DOWN@
ramp-volume-2 = @GLYPH_VOL_UP@
format-prefix-foreground = @MUTED@
format-muted-prefix-foreground = @MUTED@
label-padding = 2
click-right = pavucontrol

[module/media]
type = custom/script
exec = ~/.config/polybar/scripts/media.sh
interval = 2
format = <label>
label = %output%
label-foreground = @FG_DIM@
label-maxlen = 46
label-padding = 2
click-left = playerctl play-pause
click-right = playerctl next

[module/date]
type = internal/date
interval = 1
date = "%a %d %b"
time = "%H:%M"
format-prefix = " @GLYPH_DATE@ "
format-prefix-foreground = @MUTED@
label = %date%  %time%
label-foreground = @FG@
label-padding = 2

[module/powermenu]
type = custom/script
exec = echo " @GLYPH_POWER@ "
format-foreground = @FG_DIM@
format-padding = 2
click-left = ~/.config/i3/scripts/powermenu.sh

[module/tray]
type = internal/tray
format-margin = 6px
tray-spacing = 10px

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 600
format = <label>
label = %output%
label-padding = 2
click-left = alacritty -e ~/.config/i3/scripts/upgrade.sh
