[window]
padding = { x = 14, y = 12 }
dynamic_padding = true
decorations = "none"
opacity = 0.96
dynamic_title = true
title = "zsh"
startup_mode = "Windowed"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 11.0
offset = { x = 0, y = 1 }
glyph_offset = { x = 0, y = 0 }

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
blink_interval = 600
unfocused_hollow = true

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[shell]
program = "/bin/sh"
args = ["-lc", "fastfetch --config ~/.config/fastfetch/config.jsonc 2>/dev/null; exec zsh -l"]

# ── palette (inlined: no import key, so alacritty 0.13 → 0.17 all agree) ──
[colors.primary]
background = "@BG@"
foreground = "@FG@"
dim_foreground = "@FG_DIM@"
bright_foreground = "@FG@"

[colors.cursor]
text = "@BG_DARK@"
cursor = "@BLUE@"

[colors.vi_mode_cursor]
text = "@BG_DARK@"
cursor = "@PURPLE@"

[colors.search.matches]
foreground = "@BG_DARK@"
background = "@YELLOW@"

[colors.search.focused_match]
foreground = "@BG_DARK@"
background = "@GREEN@"

[colors.footer_bar]
foreground = "@BG_DARK@"
background = "@FG_DIM@"

[colors.hints.start]
foreground = "@BG_DARK@"
background = "@YELLOW@"

[colors.hints.end]
foreground = "@BG_DARK@"
background = "@MUTED@"

[colors.selection]
text = "@BG_DARK@"
background = "@BLUE@"

[colors.normal]
black   = "@BG_HL@"
red     = "@RED@"
green   = "@GREEN@"
yellow  = "@YELLOW@"
blue    = "@BLUE@"
magenta = "@PURPLE@"
cyan    = "@CYAN@"
white   = "@FG@"

[colors.bright]
black   = "@MUTED@"
red     = "@RED@"
green   = "@GREEN@"
yellow  = "@YELLOW@"
blue    = "@BLUE@"
magenta = "@PURPLE@"
cyan    = "@CYAN@"
white   = "@FG@"
