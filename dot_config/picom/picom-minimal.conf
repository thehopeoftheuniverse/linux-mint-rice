# Minimal low-overhead picom profile (xrender fallback with translucent windows)
backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.25;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Rofi'",
  "class_g = 'slop'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

active-opacity = 1.0;
inactive-opacity = 0.90;
frame-opacity = 0.90;
opacity-rule = [
  "100:class_g = 'xwmborders'",
  "100:fullscreen",
  "100:class_g = 'Rofi'",
  "100:class_g = 'Dunst'",
  "100:class_g = 'Polybar'",
  "100:class_g = 'kitty' && focused",
  "95:class_g = 'kitty' && !focused",
  "100:class_g = 'Alacritty' && focused",
  "95:class_g = 'Alacritty' && !focused",
  "100:class_g = 'WezTerm' && focused",
  "95:class_g = 'WezTerm' && !focused",
  "100:class_g = 'org.wezfurlong.wezterm' && focused",
  "95:class_g = 'org.wezfurlong.wezterm' && !focused",
  "100:class_g = 'Gnome-terminal' && focused",
  "95:class_g = 'Gnome-terminal' && !focused",
  "88:class_g = 'Code' && focused",
  "84:class_g = 'Code' && !focused",
  "88:class_g = 'code-oss' && focused",
  "84:class_g = 'code-oss' && !focused",
  "88:class_g = 'VSCodium' && focused",
  "84:class_g = 'VSCodium' && !focused",
  "88:class_g = 'Cursor' && focused",
  "84:class_g = 'Cursor' && !focused",
  "88:class_g = 'cursor' && focused",
  "84:class_g = 'cursor' && !focused",
  "88:class_g = 'Zed' && focused",
  "84:class_g = 'Zed' && !focused",
  "88:class_g = 'dev.zed.Zed' && focused",
  "84:class_g = 'dev.zed.Zed' && !focused",
  "88:class_g = 'Sublime_text' && focused",
  "84:class_g = 'Sublime_text' && !focused",
  "90:class_g = 'Thunar' && focused",
  "85:class_g = 'Thunar' && !focused",
  "90:class_g = 'Nemo' && focused",
  "85:class_g = 'Nemo' && !focused",
  "90:class_g = 'Pcmanfm' && focused",
  "85:class_g = 'Pcmanfm' && !focused",
  "89:class_g = 'obsidian' && focused",
  "85:class_g = 'obsidian' && !focused",
  "90:class_g = 'discord' && focused",
  "85:class_g = 'discord' && !focused",
  "90:class_g = 'Spotify' && focused",
  "85:class_g = 'Spotify' && !focused",
  "100:class_g = 'mpv'",
  "100:class_g = 'vlc'",
  "100:class_g = 'feh'",
  "100:class_g = 'imv'",
  "100:class_g = 'firefox' && focused",
  "92:class_g = 'firefox' && !focused",
  "100:class_g = 'Firefox' && focused",
  "92:class_g = 'Firefox' && !focused",
  "100:class_g = 'Google-chrome' && focused",
  "92:class_g = 'Google-chrome' && !focused",
  "100:class_g = 'Brave-browser' && focused",
  "92:class_g = 'Brave-browser' && !focused",
  "100:class_g = 'Chromium' && focused",
  "92:class_g = 'Chromium' && !focused",
  "100:class_g = 'Vivaldi-stable' && focused",
  "92:class_g = 'Vivaldi-stable' && !focused"
];

corner-radius = 0;
blur-background = false;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;

wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; fade = false; };
  menu = { shadow = false; opacity = 1.0; };
  popup_menu = { shadow = false; opacity = 1.0; };
  dropdown_menu = { shadow = false; opacity = 1.0; };
};
