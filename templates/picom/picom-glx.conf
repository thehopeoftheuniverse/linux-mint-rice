# ============================================================================
#  picom · @THEME_NAME@  ·  glx backend — blur + rounded corners (eye candy)
#  Toggle with:  ~/.config/i3/scripts/effects.sh glx|safe
# ============================================================================
backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.50;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'",
  "name = 'Notification'",
  "class_g != 'Rofi' && override_redirect = true",
  "_NET_WM_WINDOW_TYPE@:32a *= '_NET_WM_WINDOW_TYPE_DOCK'",
  "_NET_WM_WINDOW_TYPE@:32a *= '_NET_WM_WINDOW_TYPE_DESKTOP'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

blur-background = true;
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

inactive-opacity = 1.0;
opacity-rule = [
  "94:class_g = 'Alacritty' && focused",
  "89:class_g = 'Alacritty' && !focused",
  "95:class_g = 'Thunar'",
  "100:class_g = 'Rofi'",
  "100:fullscreen"
];

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.94; blur-background = true; };
  popup_menu = { opacity = 0.97; blur-background = true; };
  dropdown_menu = { opacity = 0.97; blur-background = true; };
  notification = { shadow = true; blur-background = false; };
  dock = { shadow = false; };
  desktop = { shadow = false; blur-background = false; };
};

log-level = "warn";
