# ============================================================================
#  picom · @THEME_NAME@  ·  xrender backend — lowest CPU, VM-safe
#  swap to picom-glx.conf (see i3/scripts/effects.sh) for blur + rounded corners
# ============================================================================
backend = "xrender";
vsync = false;
use-damage = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
xrender-sync-fence = true;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.48;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'",
  "name = 'Notification'",
  "class_g != 'Rofi' && override_redirect = true",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
  "_NET_WM_WINDOW_TYPE@:32a *= '_NET_WM_WINDOW_TYPE_DOCK'",
  "_NET_WM_WINDOW_TYPE@:32a *= '_NET_WM_WINDOW_TYPE_DESKTOP'",
  "x = 0 && y = 0 && override_redirect = true"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

inactive-opacity = 1.0;
frame-opacity = 1.0;
active-opacity = 1.0;
opacity-rule = [
  "94:class_g = 'Alacritty' && focused",
  "89:class_g = 'Alacritty' && !focused",
  "95:class_g = 'Thunar'",
  "100:class_g = 'Rofi'",
  "100:fullscreen"
];

blur-background = false;
corner-radius = 0;

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.94; focus = true; };
  popup_menu = { opacity = 0.97; };
  dropdown_menu = { opacity = 0.97; };
  utility = { shadow = true; };
  notification = { shadow = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  desktop = { shadow = false; };
};

log-level = "warn";
