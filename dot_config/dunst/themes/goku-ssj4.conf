# Dragon Ball: Goku SSJ4 (Crimson Fur & Golden Ki)
[global]
    frame_color = "#ef233c"
    separator_color = "#351622"
    highlight = "#fbbf24"

[urgency_low]
    background = "#080406"
    foreground = "#d6b4bc"
    frame_color = "#4d2331"
    timeout = 6

[urgency_normal]
    background = "#080406"
    foreground = "#fff1f2"
    frame_color = "#ef233c"
    timeout = 8

[urgency_critical]
    background = "#0d0609"
    foreground = "#fff1f2"
    frame_color = "#fbbf24"
    timeout = 0
