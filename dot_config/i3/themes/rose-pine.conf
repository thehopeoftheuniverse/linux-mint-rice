# Rosé Pine
set $base      #191724
set $surface   #1f1d2e
set $inactive  #26233a
set $text      #e0def4
set $muted     #908caa
set $rose      #ebbcba
set $iris      #c4a7e7
set $love      #eb6f92

# target                 title     bg        text   indicator  border
client.focused           $rose     $surface  $text  $iris      $rose
client.focused_inactive  $inactive $base     $muted $inactive  $inactive
client.unfocused         $inactive $base     $muted $inactive  $inactive
client.urgent            $love     $base     $love  $love      $love
client.placeholder       $inactive $base     $muted $inactive  $inactive
client.background        $base
