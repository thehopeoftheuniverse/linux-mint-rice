# Bleach: Yhwach (Pure Monochrome B&W Dark Mode)
[global]
    frame_color = "#ffffff"
    separator_color = "#2a2a30"
    highlight = "#ffffff"

[urgency_low]
    background = "#08080a"
    foreground = "#d4d4d8"
    frame_color = "#2a2a30"
    timeout = 6

[urgency_normal]
    background = "#08080a"
    foreground = "#fafafa"
    frame_color = "#d4d4d8"
    timeout = 8

[urgency_critical]
    background = "#040405"
    foreground = "#ffffff"
    frame_color = "#ffffff"
    timeout = 0
