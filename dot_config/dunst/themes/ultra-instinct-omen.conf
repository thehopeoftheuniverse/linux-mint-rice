# Dragon Ball: Ultra Instinct Omen
[global]
    frame_color = "#60a5fa"
    separator_color = "#1c2338"
    highlight = "#38bdf8"

[urgency_low]
    background = "#04060c"
    foreground = "#94a3b8"
    frame_color = "#1e293b"
    timeout = 6

[urgency_normal]
    background = "#04060c"
    foreground = "#e2e8f0"
    frame_color = "#60a5fa"
    timeout = 8

[urgency_critical]
    background = "#04060c"
    foreground = "#f8fafc"
    frame_color = "#f43f5e"
    timeout = 0
