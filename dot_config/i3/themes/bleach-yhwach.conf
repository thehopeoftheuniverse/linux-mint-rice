# Bleach: Soul King Yhwach (Pure Monochrome Black & White Dark Mode)
set $void      #040405
set $base      #08080a
set $surface   #111114
set $inactive  #2a2a30
set $white     #fafafa
set $silver    #d4d4d8
set $muted     #71717a
set $pure      #ffffff
set $urgent    #e4e4e7

# target                 title     bg     text    indicator  border
client.focused           $pure     $base  $white  $silver    $pure
client.focused_inactive  $inactive $void  $muted  $inactive  $inactive
client.unfocused         $inactive $void  $muted  $inactive  $inactive
client.urgent            $urgent   $base  $pure   $white     $urgent
client.placeholder       $inactive $void  $muted  $inactive  $inactive
client.background        $void
