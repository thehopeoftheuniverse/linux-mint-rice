# Tokyo Night
[global]
    frame_color = "#7aa2f7"
    separator_color = "#292e42"
    highlight = "#bb9af7"

[urgency_low]
    background = "#1a1b26"
    foreground = "#a9b1d6"
    timeout = 6

[urgency_normal]
    background = "#1a1b26"
    foreground = "#c0caf5"
    timeout = 8

[urgency_critical]
    background = "#1a1b26"
    foreground = "#c0caf5"
    frame_color = "#f7768e"
    timeout = 0
