# Alacritty < 0.13 config (Debian 12, Ubuntu 22.04, Mint 21).
# apply.sh picks this file or alacritty.toml based on the installed version.
window:
  padding:
    x: 20
    y: 18
  dynamic_padding: true
  decorations: none
  opacity: 1.0
  dynamic_title: true
  title: zsh

scrolling:
  history: 10000
  multiplier: 3

font:
  normal:
    family: "JetBrainsMono Nerd Font"
    style: Regular
  bold:
    family: "JetBrainsMono Nerd Font"
    style: Bold
  italic:
    family: "JetBrainsMono Nerd Font"
    style: Italic
  bold_italic:
    family: "JetBrainsMono Nerd Font"
    style: Bold Italic
  size: 11.0

cursor:
  style:
    shape: Beam
    blinking: On
  vi_mode_style:
    shape: Block
    blinking: Off
  blink_interval: 600
  unfocused_hollow: true

mouse:
  hide_when_typing: true

selection:
  save_to_clipboard: true

shell:
  program: /bin/zsh
  args:
    - "-l"

colors:
  primary:
    background: '@BG@'
    foreground: '@FG@'
    dim_foreground: '@FG_DIM@'
    bright_foreground: '@FG@'
  cursor:
    text: '@BG_DARK@'
    cursor: '@BLUE@'
  vi_mode_cursor:
    text: '@BG_DARK@'
    cursor: '@PURPLE@'
  selection:
    text: '@BG_DARK@'
    background: '@BLUE@'
  normal:
    black:   '@BG_HL@'
    red:     '@RED@'
    green:   '@GREEN@'
    yellow:  '@YELLOW@'
    blue:    '@BLUE@'
    magenta: '@PURPLE@'
    cyan:    '@TEAL@'
    white:   '@FG_DIM@'
  bright:
    black:   '@MUTED@'
    red:     '@ORANGE@'
    green:   '@TEAL@'
    yellow:  '@YELLOW@'
    blue:    '@CYAN@'
    magenta: '@MAGENTA@'
    cyan:    '@CYAN@'
    white:   '@FG@'
