# Dragon Ball: Ultra Instinct (Black UI)
[global]
    frame_color = "#7df9ff"
    separator_color = "#222638"
    highlight = "#7df9ff"

[urgency_low]
    background = "#050508"
    foreground = "#cbd5e1"
    frame_color = "#334155"
    timeout = 6

[urgency_normal]
    background = "#050508"
    foreground = "#f4f7ff"
    frame_color = "#7df9ff"
    timeout = 8

[urgency_critical]
    background = "#050508"
    foreground = "#f4f7ff"
    frame_color = "#fb7185"
    timeout = 0
