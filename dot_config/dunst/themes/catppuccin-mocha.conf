# Catppuccin Mocha
[global]
    frame_color = "#89b4fa"
    separator_color = frame
    highlight = "#cba6f7"

[urgency_low]
    background = "#1e1e2e"
    foreground = "#cdd6f4"
    timeout = 6

[urgency_normal]
    background = "#1e1e2e"
    foreground = "#cdd6f4"
    timeout = 8

[urgency_critical]
    background = "#1e1e2e"
    foreground = "#cdd6f4"
    frame_color = "#f38ba8"
    timeout = 0
