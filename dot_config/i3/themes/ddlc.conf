# Doki Doki Literature Club (Dark Clubroom + Sakura Pink & Monika Emerald)
set $void      #0e0910
set $base      #130c16
set $surface   #1d1221
set $inactive  #3a2642
set $text      #fff0f6
set $muted     #c49bb0
set $pink      #ff6b9d
set $emerald   #34d399
set $violet    #c084fc
set $urgent    #f43f5e

# target                 title     bg     text   indicator  border
client.focused           $pink     $base  $text  $emerald   $pink
client.focused_inactive  $inactive $void  $muted $inactive  $inactive
client.unfocused         $inactive $void  $muted $inactive  $inactive
client.urgent            $urgent   $base  $urgent $violet   $urgent
client.placeholder       $inactive $void  $muted $inactive  $inactive
client.background        $void
