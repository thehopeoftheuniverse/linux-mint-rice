# Rosé Pine
[global]
    frame_color = "#ebbcba"
    separator_color = "#403d52"
    highlight = "#c4a7e7"

[urgency_low]
    background = "#191724"
    foreground = "#908caa"
    timeout = 6

[urgency_normal]
    background = "#191724"
    foreground = "#e0def4"
    timeout = 8

[urgency_critical]
    background = "#191724"
    foreground = "#e0def4"
    frame_color = "#eb6f92"
    timeout = 0
